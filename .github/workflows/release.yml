name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install "pyqt6>=6.11.0" "yt-dlp>=2026.03.17" "pyinstaller>=6.19.0" "winotify>=1.1.0"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      
      - name: Set up Node.js (bundled for YouTube JS solver)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Bundle Node.js binary
        shell: bash
        run: cp "$(which node)" ./node.exe

      - name: Download ffmpeg
        shell: bash
        run: |
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip ffmpeg.zip
          mv ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe .
          mv ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe .
      
      - name: Build exe
        run: pyinstaller build.spec --noconfirm
      
      - name: Create ZIP
        shell: bash
        run: |
          cd dist
          7z a ../Napotom-Windows.zip Napotom.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: Napotom-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install system tools
        run: brew install sevenzip create-dmg

      - name: Set up Node.js (bundled for YouTube JS solver)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install "pyqt6>=6.11.0" "yt-dlp>=2026.03.17" "pyinstaller>=6.19.0" pync

      - name: Download ffmpeg
        run: |
          mkdir -p bin
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/7z" -o ffmpeg.7z
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/7z" -o ffprobe.7z
          7z x ffmpeg.7z -obin
          7z x ffprobe.7z -obin
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Bundle Node.js binary
        run: |
          cp "$(which node)" bin/node
          chmod +x bin/node
      
      - name: Convert iconset to icns
        run: iconutil -c icns assets/icon.iconset -o assets/icon.icns
      
      - name: Build app
        run: pyinstaller build_mac.spec --noconfirm
      
      - name: Create DMG
        run: |
          create-dmg \
            --volname "Napotom" \
            --volicon "assets/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "Napotom.app" 175 120 \
            --hide-extension "Napotom.app" \
            --app-drop-link 425 120 \
            "Napotom-macOS.dmg" \
            "dist/Napotom.app"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: Napotom-macOS.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-build
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} - Napotom
          body: |
            ## Downloads
            
            - **Windows**: Napotom-Windows.zip - распакуйте и запустите .exe
            - **macOS**: Napotom-macOS.dmg - откройте и перетащите в Applications
            
            ### Включено
            - ffmpeg встроен, дополнительная установка не требуется
            - Поддержка YouTube, VK, и 1000+ других сайтов
            - 🌍 Русский и английский языки интерфейса
            - 🍪 Поддержка cookies для возрастных ограничений
          files: |
            Napotom-Windows.zip
            Napotom-macOS.dmg
          draft: false
          prerelease: false
